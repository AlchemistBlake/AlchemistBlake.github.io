<title id="t">Singularity ET deterministic simulation loop</title><desc id="d">Inputs enter a fixed-timestep tick; ECS systems update using a seeded RNG service, emit events, and reducers update a single authoritative WorldState; inputs and seed are written to a replay log so the run can be reproduced exactly.</desc>

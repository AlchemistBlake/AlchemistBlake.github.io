<text x="25" y="32" font-size="13" font-weight="700" letter-spacing="1.5" fill="#a78bfa">THE SOVEREIGN SYSTEM · L0–L9</text><rect x="25" y="52" width="620" height="58" rx="9" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="41" y="87" font-size="15" font-weight="800" fill="#a78bfa">L9</text><text x="81" y="76" font-size="15" font-weight="600" fill="#ece8f6">Metaphysics &amp; Visual Transduction</text><text x="81" y="95" font-size="12.5" fill="#b4aecb">physics-constrained state model · telemetry → visual &amp; acoustic rendering</text><rect x="25" y="118" width="620" height="58" rx="9" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="41" y="153" font-size="15" font-weight="800" fill="#a78bfa">L8</text><text x="81" y="142" font-size="15" font-weight="600" fill="#ece8f6">Global Stability Controller (GSC)</text><text x="81" y="161" font-size="12.5" fill="#b4aecb">multi-variable PID control over drift, retries &amp; token utility</text><rect x="25" y="184" width="620" height="58" rx="9" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="41" y="219" font-size="15" font-weight="800" fill="#a78bfa">L7</text><text x="81" y="208" font-size="15" font-weight="600" fill="#ece8f6">Verifiable Security (ManyIH &amp; eBPF)</text><text x="81" y="227" font-size="12.5" fill="#b4aecb">instruction-privilege hierarchy · gVisor/Kata sandboxes · sys_enter_execve tracing</text><rect x="25" y="250" width="620" height="58" rx="9" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="41" y="285" font-size="15" font-weight="800" fill="#a78bfa">L6</text><text x="81" y="274" font-size="15" font-weight="600" fill="#ece8f6">Dynamic Attentional Context Scoping (DACS)</text><text x="81" y="293" font-size="12.5" fill="#b4aecb">REGISTRY / FOCUS context modes · delta-fused context compiler</text><rect x="25" y="316" width="620" height="58" rx="9" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="41" y="351" font-size="15" font-weight="800" fill="#a78bfa">L5</text><text x="81" y="340" font-size="15" font-weight="600" fill="#ece8f6">Metacognitive Agent Spawning</text><text x="81" y="359" font-size="12.5" fill="#b4aecb">threshold-triggered dynamic sub-agent instantiation (spawn score &gt; 0.7)</text><rect x="25" y="382" width="620" height="58" rx="9" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="41" y="417" font-size="15" font-weight="800" fill="#a78bfa">L4</text><text x="81" y="406" font-size="15" font-weight="600" fill="#ece8f6">Dijkstra-based Tool Graph Routing</text><text x="81" y="425" font-size="12.5" fill="#b4aecb">deterministic min-cost tool paths · circuit breakers, no LLM in routing</text><rect x="25" y="448" width="620" height="58" rx="9" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="41" y="483" font-size="15" font-weight="800" fill="#a78bfa">L3</text><text x="81" y="472" font-size="15" font-weight="600" fill="#ece8f6">Temporal Orchestration &amp; Try-Heal-Retry</text><text x="81" y="491" font-size="12.5" fill="#b4aecb">durable workflows (Go SDK) isolate volatile AI activities · self-healing retries</text><rect x="25" y="514" width="620" height="58" rx="9" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="41" y="549" font-size="15" font-weight="800" fill="#a78bfa">L2</text><text x="81" y="538" font-size="15" font-weight="600" fill="#ece8f6">Decentralized YAML Registry &amp; Unified Namespace</text><text x="81" y="557" font-size="12.5" fill="#b4aecb">global MCP_ID addressing · DAG dependencies · optimistic locking</text><rect x="25" y="580" width="620" height="58" rx="9" fill="url(#gv)" stroke="#a78bfa" stroke-width="1.3"/><text x="41" y="615" font-size="15" font-weight="800" fill="#a78bfa">L1</text><text x="81" y="604" font-size="15" font-weight="600" fill="#ece8f6">Generative Constraints (FSM control)</text><text x="81" y="623" font-size="12.5" fill="#b4aecb">FSM / pushdown-automata logit masking blocks schema-violating tokens</text><rect x="25" y="646" width="620" height="58" rx="9" fill="url(#gg)" stroke="#e7c27d" stroke-width="1.3"/><text x="41" y="681" font-size="15" font-weight="800" fill="#e7c27d">L0</text><text x="81" y="670" font-size="15" font-weight="600" fill="#ece8f6">Sovereign Constraint Kernel</text><text x="81" y="689" font-size="12.5" fill="#b4aecb">persistent-state kernel · dual pipeline (SAC / iSAC) · fixed invariants</text><text x="25" y="730" font-size="12" fill="#b4aecb">Violet = where neural generation runs (bounded by L1). Gold = trust anchors: kernel, clock, boot, ledger.</text><text x="25" y="748" font-size="12" fill="#b4aecb">All other layers are symbolic and deterministic.</text><rect x="675" y="52" width="400" height="58" rx="10" fill="url(#gg)" stroke="#e7c27d" stroke-width="1.3"/><text x="875.0" y="76.7" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ece8f6">96.7 Hz master clock</text><text x="875.0" y="95.5" text-anchor="middle" font-size="13.0" font-weight="400" fill="#b4aecb">fixed-rate tick every 10.341 ms · synchronizes all layers</text><text x="675" y="138" font-size="12" font-weight="700" letter-spacing="1" fill="#a78bfa">RUNTIME COMPONENTS</text><rect x="675" y="146" width="196" height="56" rx="10" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="773.0" y="169.9" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ece8f6">Cognitive Router</text><text x="773.0" y="187.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#b4aecb">intent vs. math state</text><rect x="879" y="146" width="196" height="56" rx="10" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="977.0" y="169.9" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ece8f6">Blake.ENG Logic Engine</text><text x="977.0" y="187.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#b4aecb">strict resolver · JSON schemas</text><rect x="675" y="210" width="196" height="56" rx="10" fill="url(#gv)" stroke="#a78bfa99" stroke-width="1.3"/><text x="773.0" y="233.9" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ece8f6">Narrative CM</text><text x="773.0" y="251.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#b4aecb">math state → prose</text><rect x="879" y="210" width="196" height="56" rx="10" fill="#ffffff08" stroke="#3a3358" stroke-width="1.3"/><text x="977.0" y="233.9" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ece8f6">Unified Namespace</text><text x="977.0" y="251.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#b4aecb">persistent single source of truth</text><text x="675" y="300" font-size="12" font-weight="700" letter-spacing="1" fill="#e7c27d">BOOT &amp; IDENTITY</text><rect x="675" y="308" width="280" height="50" rx="10" fill="#ffffff08" stroke="#e7c27dcc" stroke-width="1.3"/><text x="815.0" y="329.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ece8f6">Sovereign Genesis Sequence</text><text x="815.0" y="346.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#b4aecb">deterministic bootstrap</text><rect x="675" y="380" width="280" height="50" rx="10" fill="#ffffff08" stroke="#e7c27dcc" stroke-width="1.3"/><text x="815.0" y="401.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ece8f6">Root-hash verification</text><text x="815.0" y="418.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#b4aecb">Pi-Binary-Spiral memory reference</text><path d="M815 359L815 378" stroke="#e7c27d" stroke-width="1.6" fill="none" marker-end="url(#ag)"/><rect x="675" y="452" width="280" height="50" rx="10" fill="#ffffff08" stroke="#e7c27dcc" stroke-width="1.3"/><text x="815.0" y="473.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ece8f6">Mirrorboot Oracle</text><text x="815.0" y="490.5" text-anchor="middle" font-size="12.0" font-weight="400" fill="#b4aecb">identity lock · boot-integrity check</text><path d="M815 431L815 450" stroke="#e7c27d" stroke-width="1.6" fill="none" marker-end="url(#ag)"/><path d="M957 405.0L1069 405.0" stroke="#b4aecb" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 5"/><text x="1016" y="397.0" text-anchor="middle" font-size="11" fill="#b4aecb">hash mismatch</text><text x="1016" y="423.0" text-anchor="middle" font-size="11" fill="#b4aecb">→ safe fallback</text><rect x="675" y="538" width="400" height="166" rx="12" fill="url(#gg)" stroke="#e7c27d"/><text x="691" y="562" font-size="14" font-weight="600" fill="#ece8f6">Merkle-chain ledger</text><text x="1059" y="562" text-anchor="end" font-size="12" fill="#b4aecb">append-only · tamper-evident</text><rect x="691" y="578" width="108" height="40" rx="7" fill="#12101d" stroke="#e7c27d" stroke-opacity=".8"/><text x="745.0" y="595" text-anchor="middle" font-size="11.5" fill="#ece8f6">transition 1</text><text x="745.0" y="610" text-anchor="middle" font-size="10.5" font-family="ui-monospace,monospace" fill="#e7c27d">H(prev ‖ tuple)</text><rect x="821" y="578" width="108" height="40" rx="7" fill="#12101d" stroke="#e7c27d" stroke-opacity=".8"/><text x="875.0" y="595" text-anchor="middle" font-size="11.5" fill="#ece8f6">transition 2</text><text x="875.0" y="610" text-anchor="middle" font-size="10.5" font-family="ui-monospace,monospace" fill="#e7c27d">H(prev ‖ tuple)</text><path d="M801 598L819 598" stroke="#e7c27d" stroke-width="1.6" fill="none" marker-end="url(#ag)"/><rect x="951" y="578" width="108" height="40" rx="7" fill="#12101d" stroke="#e7c27d" stroke-opacity=".8"/><text x="1005.0" y="595" text-anchor="middle" font-size="11.5" fill="#ece8f6">transition 3</text><text x="1005.0" y="610" text-anchor="middle" font-size="10.5" font-family="ui-monospace,monospace" fill="#e7c27d">H(prev ‖ tuple)</text><path d="M931 598L949 598" stroke="#e7c27d" stroke-width="1.6" fill="none" marker-end="url(#ag)"/><text x="691" y="642" font-size="12" font-family="ui-monospace,monospace" fill="#e7c27d">Root_n = Merkle(T_1 … T_n)</text><text x="691" y="664" font-size="11.5" fill="#b4aecb">a mutation breaks the chain → eBPF alert · node quarantine</text><text x="691" y="684" font-size="11.5" fill="#b4aecb">incremental verification for light clients &amp; edge nodes</text></svg>
<title id="t">Neuro-symbolic separated dual-pipeline hypergraph topology</title><desc id="d">Two decoupled pipelines: probabilistic neural inference on one side and deterministic symbolic reasoning on the other, sharing no mutable state, both operating over a hypergraph knowledge representation.</desc>

// tiny LZW for save codes
function lzwEncode(s){const dict={};let data=(s+'').split(''),out=[],phrase=data[0],code=256;for(let i=1;i<data.length;i++){const c=data[i];if(dict[phrase+c]!=null)phrase+=c;else{out.push(phrase.length>1?dict[phrase]:phrase.charCodeAt(0));dict[phrase+c]=code++;phrase=c;}}out.push(phrase.length>1?dict[phrase]:phrase.charCodeAt(0));return out.map(x=>String.fromCharCode(x)).join('');}
function lzwDecode(s){const dict={};let data=(s+'').split(''),curr=data[0],old=curr,out=[curr],code=256;for(let i=1;i<data.length;i++){const cc=data[i].charCodeAt(0);let phrase;if(cc<256)phrase=data[i];else phrase=dict[cc]?dict[cc]:(old+old[0]);out.push(phrase);dict[code++]=old+phrase[0];old=phrase;}return out.join('');}
function toB64(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function fromB64(b){b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return decodeURIComponent(escape(atob(b)));}
function exportSaveCode(){const raw=JSON.stringify(meta);const packed=lzwEncode(raw);return 'SC2.'+toB64(packed);}
function importSaveCode(code){
  try{
    code=(code||'').trim();
    if(!code.startsWith('SC2.'))throw new Error('bad prefix');
    const packed=fromB64(code.slice(4));
    const json=lzwDecode(packed);
    const m=JSON.parse(json);
    if(!m||m.v!==2||typeof m.points!=='number')throw new Error('bad meta');
    meta=Object.assign(defaultMeta(),m);
    if(!meta.skills||typeof meta.skills!=='object')meta.skills=defaultMeta().skills;
    for(const id of SKILL_KEYS){meta.skills[id]=Math.max(0,Math.min(SKILL_DEF[id].levels.length,meta.skills[id]|0));}
    meta.points=Math.max(0,meta.points|0);meta.loc=clamp(meta.loc|0,0,LOCS.length-1);meta.stage=clamp(meta.stage|0,0,3);
    meta.maxLoc=clamp(meta.maxLoc|0,0,LOCS.length-1);
    if(!meta.unlocked)meta.unlocked=defaultMeta().unlocked;
    meta.equipped=Array.isArray(meta.equipped)?meta.equipped.filter(id=>SKILL_DEF[id]&&(meta.skills[id]|0)>0):[];
    meta.equipped=[...new Set(meta.equipped)].slice(0,3);
    for(const id of SKILL_KEYS){if(meta.equipped.length>=3)break;if((meta.skills[id]|0)>0&&!meta.equipped.includes(id))meta.equipped.push(id);}
    while(meta.equipped.length<3)meta.equipped.push(meta.equipped[0]||'dash');
    meta.equipped=[...new Set(meta.equipped)].slice(0,3);
    if(!meta.equipped.length)meta.equipped=['dash','shield','tidal'];
    muted=!!meta.muted;store.set(MUTE_KEY,muted?'1':'0');
    autosave();return true;
  }catch(e){console.warn('import fail',e);return false;}
}

function loadSave(){

    meta=Object.assign(defaultMeta(),m);

    for(const id of SKILL_KEYS){meta.skills[id]=Math.max(0,Math.min(SKILL_DEF[id].levels.length,meta.skills[id]|0));}
    meta.points=Math.max(0,meta.points|0);meta.loc=clamp(meta.loc|0,0,LOCS.length-1);meta.stage=clamp(meta.stage|0,0,3);
    meta.maxLoc=clamp(meta.maxLoc|0,0,LOCS.length-1);
    meta.equipped=Array.isArray(meta.equipped)?[...new Set(meta.equipped.filter(id=>SKILL_DEF[id]&&(meta.skills[id]|0)>0))].slice(0,3):[];
    for(const id of SKILL_KEYS){if(meta.equipped.length>=3)break;if((meta.skills[id]|0)>0&&!meta.equipped.includes(id))meta.equipped.push(id);}

let coop={mode:'solo',role:'host',room:null,p2Local:false,peers:{},channel:null,rtc:null,dc:null,lastPing:0,status:'',offer:'',answer:''};
function roomId(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function inviteUrl(room){return String(location.href).split('#')[0]+'#coop='+room;}
function parseInviteHash(){const h=(location.hash||'').replace(/^#/,'');const m=h.match(/coop=([A-Za-z0-9]+)/);return m?m[1].toUpperCase():null;}
function startLocalCoop(){coop.mode='local';coop.p2Local=true;coop.role='host';coop.status='Local 2P — P2: IJKL move, ; fire, U/O/Y skills';}
function openHostRoom(){

function setupBroadcast(room){
  try{
    if(coop.channel)coop.channel.close();
    coop.channel=new BroadcastChannel('sc_'+room);
    coop.channel.onmessage=(ev)=>onNetMsg(ev.data,'bc');
  }catch(e){coop.channel=null;}
}
async function setupHostRtc(){
  try{
    coop.rtc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    coop.dc=coop.rtc.createDataChannel('game');
    wireDc(coop.dc);
    coop.rtc.onicecandidate=e=>{if(!e.candidate&&coop.rtc.localDescription){coop.offer=toB64(JSON.stringify(coop.rtc.localDescription));if(coop.channel)coop.channel.postMessage({t:'sdp',role:'host',sdp:coop.offer});}};
    const offer=await coop.rtc.createOffer();await coop.rtc.setLocalDescription(offer);
  }catch(e){coop.status='WebRTC unavailable — BroadcastChannel / local only';}
}
async function setupGuestRtc(){
  try{
    coop.rtc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    coop.rtc.ondatachannel=e=>{coop.dc=e.channel;wireDc(coop.dc);};
    coop.rtc.onicecandidate=e=>{if(!e.candidate&&coop.rtc.localDescription){coop.answer=toB64(JSON.stringify(coop.rtc.localDescription));if(coop.channel)coop.channel.postMessage({t:'sdp',role:'guest',sdp:coop.answer});}};
  }catch(e){}
}
function wireDc(dc){dc.onopen=()=>{coop.status='Peer linked!';};dc.onmessage=ev=>{try{onNetMsg(JSON.parse(ev.data),'rtc');}catch(e){}};}
async function onNetMsg(msg,via){
  if(!msg||!msg.t)return;
  if(msg.t==='hello'&&coop.role==='host'){coop.status='Friend tab found ('+via+')';if(coop.offer&&coop.channel)coop.channel.postMessage({t:'sdp',role:'host',sdp:coop.offer});}
  if(msg.t==='sdp'&&msg.role==='host'&&coop.role==='guest'&&coop.rtc){
    try{await coop.rtc.setRemoteDescription(JSON.parse(fromB64(msg.sdp)));const ans=await coop.rtc.createAnswer();await coop.rtc.setLocalDescription(ans);}catch(e){}
  }
  if(msg.t==='sdp'&&msg.role==='guest'&&coop.role==='host'&&coop.rtc){
    try{await coop.rtc.setRemoteDescription(JSON.parse(fromB64(msg.sdp)));coop.status='WebRTC connected';}catch(e){}
  }
  if(msg.t==='input'&&coop.role==='host'){netP2=msg.input;netP2.t=time;}
  if(msg.t==='state'&&coop.role==='guest'){applyGuestState(msg);}}

function alivePlayers(){return players.filter(p=>!p.dead);}
function nearestTarget(p){
  let best=null,bd=1e9;
  for(const e of enemies){if(e.dead||e.spawnT>0)continue;const d=dist(p.x,p.y,e.x,e.y);if(d<bd){bd=d;best=e;}}
  if(boss&&boss.st!=='intro'&&boss.st!=='dying'){const d=dist(p.x,p.y,boss.x,boss.y)-boss.r;if(d<bd)best=boss;}
  return best;
}
function slotSkill(p,slot){return p.eq[slot]||null;}
function useSkillSlot(p,slot){
  const id=slotSkill(p,slot);if(!id||!isUnlocked(id)||p.dead)return;
  if(id==='dash')useDash(p);else if(id==='shield')useShield(p);else if(id==='tidal')useTidal(p);
  else if(id==='barrage')useBarrage(p);else if(id==='whirl')useWhirl(p);else if(id==='mine')useMine(p);
}
function useDash(p){
  if(p.cds.dash>0||p.dashT>0)return;const st=skillStats('dash');
  const moving=Math.hypot(p.mvx,p.mvy)>0.1;const a=moving?Math.atan2(p.mvy,p.mvx):p.aim;
  p.dashDx=Math.cos(a);p.dashDy=Math.sin(a);p.dashT=0.2;p.cds.dash=st.cd;p.dashHit.clear();p.kx=p.ky=0;SFX.dash();bubbles(p.x,p.y,8);shake=Math.max(shake,3);
}
function useShield(p){if(p.cds.shield>0)return;const st=skillStats('shield');p.shieldT=st.dur;p.cds.shield=st.cd;SFX.shield();ring(p.x,p.y,10,st.r+10,0.35,'#bff3ff',4);bubbles(p.x,p.y,12);}
function useTidal(p){

  p.tidal=0;SFX.tidal();shake=Math.max(shake,14);

  eBul=[];for(const e of enemies){if(e.dead||e.spawnT>0)continue;if(dist(p.x,p.y,e.x,e.y)<st.r+e.r)hitEnemy(e,st.dmg,e.x-p.x,e.y-p.y,650);}
  if(boss&&dist(p.x,p.y,boss.x,boss.y)<st.r+boss.r)hitBoss(st.bdmg,boss.x,boss.y);
  floater(p.x,p.y-46,'TIDAL WAVE!','#7fe3ff',20);

  const spread=0.7;for(let i=0;i<st.n;i++){const a=p.aim-spread/2+spread*i/Math.max(1,st.n-1);const ca=Math.cos(a),sa=Math.sin(a);
    pBul.push({x:p.x+ca*28,y:p.y-8+sa*28,vx:ca*680,vy:sa*680,r:7,dmg:st.dmg,life:1.0,refl:false,owner:p.pid});}

function inputFor(p){
  let mx=0,my=0,fire=false,s=[0,0,0];
  if(p.pid===0){
    if(keys['a']||keys['arrowleft'])mx--;if(keys['d']||keys['arrowright'])mx++;
    if(keys['w']||keys['arrowup'])my--;if(keys['s']||keys['arrowdown'])my++;
    if(joy.id!==null){mx+=joy.dx;my+=joy.dy;}
    fire=!!(keys[' ']||mouse.down||fireTouchId!==null);
    // skill keys depend on mode
    if(coop.p2Local){s[0]=keys['q']?1:0;s[1]=keys['e']?1:0;s[2]=keys['r']?1:0;}
    else{s[0]=(keys['q']||keys['1'])?1:0;s[1]=(keys['e']||keys['2'])?1:0;s[2]=(keys['r']||keys['3'])?1:0;}
  }else if(coop.p2Local){
    if(keys['j'])mx--;if(keys['l'])mx++;if(keys['i'])my--;if(keys['k'])my++;
    fire=!!keys[';'];s[0]=keys['u']?1:0;s[1]=keys['o']?1:0;s[2]=keys['y']?1:0;
  }else if(coop.mode==='online'&&coop.role==='host'){
    if(time-netP2.t<0.5){mx=netP2.mx;my=netP2.my;fire=!!netP2.fire;s=[netP2.s0,netP2.s1,netP2.s2];}
  }
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  return {mx,my,fire,s,ml};
}

function updatePlayer(p,dt){
  p.trail.forEach(t=>t.life-=dt);p.trail=p.trail.filter(t=>t.life>0);if(p.dead)return;
  const inp=inputFor(p);p.mvx=inp.mx;p.mvy=inp.my;if(inp.ml>0.1)p.lastDir=Math.atan2(inp.my,inp.mx);
  const tgt=nearestTarget(p);
  if(p.pid===0&&!isTouch&&time-mouse.t<2.5)p.aim=angTo(p.x,p.y-8,mouse.x,mouse.y);
  else if(tgt)p.aim=angTo(p.x,p.y-8,tgt.x,tgt.y);else if(inp.ml>0.1)p.aim=p.lastDir;
  p.fireCd-=dt;p.inv=Math.max(0,p.inv-dt);p.snap=Math.max(0,p.snap-dt);p.shieldT=Math.max(0,p.shieldT-dt);
  for(const k of SKILL_KEYS)p.cds[k]=Math.max(0,p.cds[k]-dt);
  // edge-trigger skills
  for(let i=0;i<3;i++){if(inp.s[i]&&!p._sp){/* handled below */} }
  if(!p._prevS)p._prevS=[0,0,0];
  for(let i=0;i<3;i++){if(inp.s[i]&&!p._prevS[i])useSkillSlot(p,i);}
  p._prevS=inp.s.slice();

  const stDash=isUnlocked('dash')?skillStats('dash'):{dmg:35};
  if(p.dashT>0){
    p.dashT-=dt;p.x+=p.dashDx*950*dt;p.y+=p.dashDy*950*dt;p.trail.push({x:p.x,y:p.y,life:0.2});
    for(const e of enemies){if(e.dead||e.spawnT>0||p.dashHit.has(e))continue;if(dist(p.x,p.y,e.x,e.y)<p.r+e.r+8){p.dashHit.add(e);hitEnemy(e,stDash.dmg,p.dashDx,p.dashDy,520);}}
    if(boss&&!p.dashHit.has(boss)&&dist(p.x,p.y,boss.x,boss.y)<p.r+boss.r){p.dashHit.add(boss);hitBoss(stDash.dmg,p.x,p.y);}
    p.vx=p.dashDx*250;p.vy=p.dashDy*250;
  }else{
    const sp=250;p.vx+=(inp.mx*sp-p.vx)*Math.min(1,dt*12);p.vy+=(inp.my*sp-p.vy)*Math.min(1,dt*12);p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  p.walk+=Math.hypot(p.vx,p.vy)*dt*0.045;p.x+=p.kx*dt;p.y+=p.ky*dt;const kd=Math.exp(-8*dt);p.kx*=kd;p.ky*=kd;
  p.x=clamp(p.x,A.x0+p.r,A.x1-p.r);p.y=clamp(p.y,A.y0+p.r*0.6,A.y1-p.r);
  if(inp.fire&&p.fireCd<=0&&p.dashT<=0){
    p.fireCd=0.16;const ca=Math.cos(p.aim),sa=Math.sin(p.aim);
    pBul.push({x:p.x+ca*30,y:p.y-8+sa*30,vx:ca*600,vy:sa*600,r:6,dmg:10,life:1.1,refl:false,owner:p.pid});
    p.snap=0.1;SFX.shoot();
  }
}
function hurtPlayer(p,dmg,sx,sy,kbf=1){
  if(state!=='play'||!p||p.dead)return false;if(p.dashT>0||p.inv>0)return false;
  if(p.shieldT>0){SFX.block();ring(p.x,p.y,44,58,0.25,'#bff3ff',3);return false;}
  p.hp-=dmg;p.inv=0.9;const a=angTo(sx,sy,p.x,p.y);p.kx=Math.cos(a)*400*kbf;p.ky=Math.sin(a)*400*kbf;
  shake=Math.max(shake,9);hitStop=Math.max(hitStop,0.05);SFX.hurt();floater(p.x,p.y-34,'-'+dmg,'#ff4d4d',18);spark(p.x,p.y,14,'#ff6a45',280,4);
  combo=0;comboT=0;

function spawnEnemy(type,x,y){

function hitEnemy(e,dmg,dx,dy,kb){
  if(e.dead||e.spawnT>0)return;e.hp-=dmg;e.flash=0.1;const l=Math.hypot(dx,dy)||1;e.kx+=dx/l*kb*e.kb;e.ky+=dy/l*kb*e.kb;
  spark(e.x,e.y,4,'#fff3a0',160,2.5,0.25);floater(e.x,e.y-e.r-6,String(Math.round(dmg)),'#fff',13);
  for(const p of alivePlayers()){if(isUnlocked('tidal')){const st=skillStats('tidal');p.tidal=Math.min(st.need,p.tidal+dmg*0.14);}}

function killEnemy(e,scored){

  spark(e.x,e.y,18,e.color,300,4,0.5);bubbles(e.x,e.y,6);ring(e.x,e.y,6,e.r*2.4,0.3,'#fff',3);SFX.kill();hitStop=Math.max(hitStop,0.03);shake=Math.max(shake,3);
}
function fireBullet(x,y,a,spd,kind,dmg=10,r=6){eBul.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r,dmg,kind,life:6});}
function pickVictim(e){const al=alivePlayers();if(!al.length)return primary();let best=al[0],bd=1e9;for(const p of al){const d=dist(e.x,e.y,p.x,p.y);if(d<bd){bd=d;best=p;}}return best;}

function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;e.anim+=dt;e.flash=Math.max(0,e.flash-dt);e.shT=Math.max(0,e.shT-dt);
    if(e.spawnT>0){e.spawnT-=dt;continue;}
    e.x+=e.kx*dt;e.y+=e.ky*dt;const kd=Math.exp(-7*dt);e.kx*=kd;e.ky*=kd;
    const P=pickVictim(e);if(!P)continue;const d=dist(e.x,e.y,P.x,P.y),a=angTo(e.x,e.y,P.x,P.y);e.t-=dt;
    const ai=e.ai;
    if(ai==='dive'){
      if(e.st==='init'){e.st='orbit';e.t=rand(1.2,2.2);}
      if(e.st==='orbit'){e.ang+=dt*0.9*e.dir;const tx=P.x+Math.cos(e.ang)*200,ty=P.y+Math.sin(e.ang)*150;const ta=angTo(e.x,e.y,tx,ty),sp=Math.min(e.spd,dist(e.x,e.y,tx,ty)*3);
        e.vx+=(Math.cos(ta)*sp-e.vx)*Math.min(1,dt*4);e.vy+=(Math.sin(ta)*sp-e.vy)*Math.min(1,dt*4);e.x+=e.vx*dt;e.y+=e.vy*dt;if(Math.hypot(e.vx,e.vy)>15)e.head=Math.atan2(e.vy,e.vx);
        if(e.t<=0){e.st='tele';e.t=0.55;e.lock=a;SFX.tele();}}
      else if(e.st==='tele'){if(e.t>0.15)e.lock=a;e.x-=Math.cos(e.lock)*30*dt;e.y-=Math.sin(e.lock)*30*dt;e.head=e.lock;if(e.t<=0){e.st='dive';e.t=0.55;const s=540+locIdx*20;e.vx=Math.cos(e.lock)*s;e.vy=Math.sin(e.lock)*s;}}
      else if(e.st==='dive'){e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.t<=0){e.st='recover';e.t=0.55;}}
      else if(e.st==='recover'){const dd=Math.exp(-3*dt);e.vx*=dd;e.vy*=dd;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.t<=0){e.st='orbit';e.t=rand(1.3,2.2);e.ang=angTo(P.x,P.y,e.x,e.y);}}
    }else if(ai==='spray'){
      if(e.st==='init'){e.st='move';e.t=rand(1.4,2.4);}
      const want=d>290?1:d<200?-1:0;const vx=(Math.cos(a)*want+Math.cos(a+Math.PI/2)*e.dir*0.5)*e.spd;const vy=(Math.sin(a)*want+Math.sin(a+Math.PI/2)*e.dir*0.5)*e.spd;
      const slow=e.t<0.55?0.2:1;e.x+=vx*dt*slow;e.y+=vy*dt*slow;e.rot+=dt*0.6;e.tele=e.t<0.55;if(Math.random()<dt*0.3)e.dir*=-1;
      if(e.t<=0){const n=8+Math.min(4,locIdx);for(let i=0;i<n;i++){const ang=e.rot+i/n*TAU;fireBullet(e.x+Math.cos(ang)*e.r,e.y+Math.sin(ang)*e.r,ang,180+locIdx*8,'spine',10,6);}e.t=rand(2.2,3.0);SFX.spine();e.tele=false;}
    }else if(ai==='slam'){
      if(e.st==='init')e.st='chase';
      if(e.st==='chase'){e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt;e.head=a;if(d<105){e.st='wind';e.t=0.7;SFX.tele();}}
      else if(e.st==='wind'){if(e.t<=0){SFX.slam();shake=Math.max(shake,7);ring(e.x,e.y,10,100,0.35,'#fff1c1',6);for(const p of alivePlayers()){if(dist(e.x,e.y,p.x,p.y)<100+p.r*0.3)hurtPlayer(p,18+locIdx*2,e.x,e.y,1.2);}e.st='rest';e.t=0.85;}}
      else if(e.st==='rest'&&e.t<=0)e.st='chase';
    }else if(ai==='zap'){
      if(e.st==='init'){e.st='drift';e.t=rand(1,2);}
      if(e.st==='drift'){e.x+=(Math.cos(a)*e.spd+Math.cos(e.anim*2)*40)*dt;e.y+=(Math.sin(a)*e.spd+Math.sin(e.anim*3)*30)*dt;if(d<170&&e.t<=0){e.st='charge';e.t=0.65;SFX.tele();}}
      else if(e.st==='charge'){e.x+=Math.cos(a)*e.spd*0.2*dt;e.y+=Math.sin(a)*e.spd*0.2*dt;if(e.t<=0){SFX.zap();ring(e.x,e.y,10,85,0.3,'#fff36b',4);for(const p of alivePlayers()){if(dist(e.x,e.y,p.x,p.y)<85+p.r*0.5)hurtPlayer(p,11+locIdx,e.x,e.y,0.8);}e.st='drift';e.t=2.3;}}
    }
    e.x=clamp(e.x,A.x0+e.r*0.2,A.x1-e.r*0.2);e.y=clamp(e.y,A.y0*0.7,A.y1-e.r*0.3);
    for(const p of alivePlayers()){
      if(dist(e.x,e.y,p.x,p.y)<e.r+p.r-4){
        if(p.shieldT>0){if(e.shT<=0){e.shT=0.4;hitEnemy(e,6,e.x-p.x,e.y-p.y,500);SFX.block();}}
        else hurtPlayer(p,Math.round(e.contact*(e.st==='dive'?1.4:1)),e.x,e.y);
      }
    }
  }
  enemies=enemies.filter(e=>!e.dead);
}

// ===== BOSSES =====
function spawnBoss(){
  const bdef=LOCS[locIdx].boss;
  boss={id:bdef.id,name:bdef.name,x:W/2,y:-120,r:62,hp:bdef.hp,max:bdef.hp,phase:1,st:'intro',t:2.6,flash:0,last:'',anim:0,
    volleys:0,fireT:0,spA:0,lock:0,vx:0,vy:0,dizzy:0,shT:0,heads:3,headHp:[],headRegen:[0,0,0],headWindow:0,barrier:0,hackCd:4};
  if(bdef.id==='hydra'){boss.heads=3;const hh=220+locIdx*20;boss.headHp=[hh,hh,hh];boss.headMax=hh;boss.headRegen=[0,0,0];boss.r=55;}
  if(bdef.id==='captain'){boss.barrier=280+locIdx*40;boss.barrierMax=boss.barrier;boss.r=60;}
  if(bdef.id==='titan')boss.r=70;
  if(bdef.id==='mech'){boss.r=58;boss.hackCd=5;}
}
function bossInvulnerable(){return !boss||boss.st==='intro'||boss.st==='enrage'||boss.st==='dying'||boss.st==='barrier';}
function hitBoss(dmg,x,y){
  if(!boss)return;
  if(bossInvulnerable()){spark(x,y,3,'#9fd3ff',120,2,0.2);if(time-lastImmune>0.5){floater(x,y-10,'IMMUNE','#9fd3ff',12);lastImmune=time;}return;}
  // Captain spectral barrier absorbs hits until broken
  if(boss.id==='captain'&&(boss.barrier|0)>0){
    boss.barrier=Math.max(0,boss.barrier-dmg);boss.flash=0.1;spark(x,y,6,'#8a9bb0',160,3,0.25);
    floater(x,y-10,boss.barrier>0?'BARRIER':'SHATTERED!',boss.barrier>0?'#9fd3ff':'#ffe14d',boss.barrier>0?12:16);
    SFX.block();if(boss.barrier<=0){ring(boss.x,boss.y,20,120,0.45,'#c9a227',6);SFX.boom();}
    return;
  }
  // Hydra: damage living heads first; body only vulnerable when all heads are down
  if(boss.id==='hydra'&&boss.headHp&&boss.headHp.length){
    const live=boss.headHp.map((h,i)=>({h,i})).filter(o=>o.h>0);
    if(live.length){
      const tgt=live[Math.floor(Math.random()*live.length)];
      const hdmg=Math.round(dmg*(boss.dizzy>0?1.5:1));
      boss.headHp[tgt.i]=Math.max(0,boss.headHp[tgt.i]-hdmg);boss.flash=0.1;
      spark(x,y,5,'#7fffd4',180,3,0.3);floater(x,y-10,'HEAD '+Math.round(hdmg),'#7fffd4',13);SFX.hit();
      if(boss.headHp[tgt.i]<=0){boss.headRegen[tgt.i]=3.5;floater(boss.x,boss.y-70,'HEAD DOWN!','#ff7eb9',15);SFX.kill();}
      if(boss.headHp.every(h=>h<=0)){floater(boss.x,boss.y-90,'ALL HEADS DOWN!','#ffe14d',18);boss.headWindow=2.8;SFX.roar();}
      for(const p of alivePlayers()){if(isUnlocked('tidal')){const st=skillStats('tidal');p.tidal=Math.min(st.need,p.tidal+hdmg*0.08);}}
      return;
    }
    // all heads down — body takes bonus damage during the window
    dmg=Math.round(dmg*1.35);
  }
  // Mech: armored outside hack windows
  if(boss.id==='mech'&&boss.st!=='hack'){dmg=Math.max(1,Math.round(dmg*0.35));if(time-lastImmune>0.7){floater(x,y-12,'ARMORED','#00fff5',11);lastImmune=time;}}
  const m=boss.dizzy>0?1.5:1;dmg=Math.round(dmg*m);boss.hp-=dmg;boss.flash=0.1;
  spark(x,y,5,boss.dizzy>0?'#ffe14d':(boss.st==='hack'?'#6dff9c':'#fff3a0'),180,3,0.3);
  floater(x,y-10,String(dmg),boss.dizzy>0?'#ffe14d':(boss.st==='hack'?'#6dff9c':'#fff'),boss.dizzy>0||boss.st==='hack'?17:13);
  for(const p of alivePlayers()){if(isUnlocked('tidal')){const st=skillStats('tidal');p.tidal=Math.min(st.need,p.tidal+dmg*0.1);}}
  SFX.hit();
  if(boss.phase===1&&boss.hp<=boss.max*0.5){boss.hp=boss.max*0.5;startEnrage();}
  else if(boss.hp<=0){boss.hp=0;bossDie();}
}
function startEnrage(){boss.st='enrage';boss.t=2.4;boss.dizzy=0;zones=[];eBul=[];showBanner('PHASE 2',boss.name.toUpperCase()+' ENRAGED!',2.4,'#ff4d4d');SFX.roar();shake=12;
  pickups.push({x:W/2-220,y:A.y1-70,t:14,ph:0},{x:W/2+220,y:A.y1-70,t:14,ph:1});
  if(boss.id==='captain'){boss.barrier=Math.round((boss.barrierMax||300)*1.25);boss.barrierMax=boss.barrier;}
  if(boss.id==='hydra'&&boss.headMax){boss.headHp=[boss.headMax,boss.headMax,boss.headMax];boss.headRegen=[0,0,0];boss.headWindow=0;}
}
function bossDie(){boss.st='dying';boss.t=2.2;eBul=[];zones=[];enemies.forEach(e=>killEnemy(e,false));enemies=[];
  const bonus=5000+locIdx*1000;floater(boss.x,boss.y-80,'+'+bonus,'#ffe14d',24);showBanner(boss.name.toUpperCase()+' DEFEATED','',2.2,'#ffe14d');SFX.boom();shake=16;}
function bossFan(a,n,spread,spd){for(let i=0;i<n;i++){const ang=a-spread/2+spread*i/Math.max(1,n-1);fireBullet(boss.x+Math.cos(ang)*55,boss.y+Math.sin(ang)*55,ang,spd,'ink',10+locIdx,8);}SFX.spine();}
function pickBossAttack(){
  const b=boss,id=b.id;
  let opts=b.phase===1?['spread','slam','spread','slam']:['spread','slam','spiral','charge','summon','charge'];
  if(id==='hydra')opts=b.phase===1?['spread','slam','summon']:['spread','spiral','summon','slam'];
  if(id==='captain')opts=b.phase===1?['spread','charge','slam']:['spiral','charge','summon','slam'];
  if(id==='titan')opts=b.phase===1?['slam','slam','spread']:['slam','charge','spiral','summon'];
  if(id==='mech')opts=b.phase===1?['spread','spiral','slam']:['charge','spiral','summon','spread'];
  opts=opts.filter(o=>o!==b.last);if(enemies.length>=3)opts=opts.filter(o=>o!=='summon');
  const c=opts[Math.floor(Math.random()*opts.length)];b.last=c;
  if(c==='spread'){b.st='spreadTele';b.t=0.6;SFX.tele();}
  else if(c==='slam'){b.st='slam';b.t=1.6;const n=b.phase===1?3:5,tt=b.phase===1?1.0:0.8;const P=primary();
    zones.push({x:P.x,y:P.y,r:64,t:tt,max:tt,dmg:20+locIdx*2,done:false,after:0});
    for(let i=1;i<n;i++){const an=rand(0,TAU),rr2=rand(100,200);zones.push({x:clamp(P.x+Math.cos(an)*rr2,A.x0+40,A.x1-40),y:clamp(P.y+Math.sin(an)*rr2,A.y0+30,A.y1-30),r:64,t:tt+i*0.12,max:tt+i*0.12,dmg:20+locIdx*2,done:false,after:0});}SFX.warn();}
  else if(c==='spiral'){b.st='spiralTele';b.t=0.65;SFX.tele();}
  else if(c==='charge'){b.st='chargeTele';b.t=0.95;b.lock=angTo(b.x,b.y,primary().x,primary().y);SFX.warn();}
  else if(c==='summon'){b.st='summon';b.t=0.9;SFX.roar();const pool=LOCS[locIdx].enemies;spawnEnemy(pool[0],b.x-100,b.y+50);spawnEnemy(pool[1]||pool[0],b.x+100,b.y+50);}
}
function updateBoss(dt){
  if(!boss)return;const b=boss;b.anim+=dt;b.flash=Math.max(0,b.flash-dt);b.t-=dt;b.dizzy=Math.max(0,b.dizzy-dt);
  // Hydra head regeneration
  if(b.id==='hydra'&&b.headHp){
    b.headWindow=Math.max(0,(b.headWindow||0)-dt);
    for(let i=0;i<b.headHp.length;i++){
      if(b.headHp[i]<=0){b.headRegen[i]=Math.max(0,(b.headRegen[i]||0)-dt);if(b.headRegen[i]<=0&&b.headWindow<=0){b.headHp[i]=b.headMax;floater(b.x+(i-1)*40,b.y-80,'HEAD REGEN','#ff7eb9',12);}}
    }
  }
  const P=primary();if(!P)return;const a=angTo(b.x,b.y,P.x,P.y);

  switch(b.st){

    case 'idle':
      if(b.id==='mech'){b.hackCd=(b.hackCd||0)-dt;if(b.hackCd<=0&&b.dizzy<=0){b.st='hack';b.t=2.6;b.hackCd=7+b.phase;showBanner('HACK WINDOW','Unload damage — armor down!',1.6,'#6dff9c');SFX.zap();ring(b.x,b.y,20,140,0.4,'#00fff5',5);break;}}
      if(b.dizzy<=0)hover(1.2);if(b.t<=0)pickBossAttack();break;
    case 'hack':hover(0.5);if(b.t<=0){b.st='idle';b.t=0.5;b.hackCd=6+b.phase;floater(b.x,b.y-80,'ARMOR UP','#00fff5',14);}break;
    case 'spreadTele':hover(0.6);if(b.t<=0){b.st='spread';b.volleys=b.phase===1?3:4;b.fireT=0;}break;
    case 'spread':hover(0.6);b.fireT-=dt;if(b.fireT<=0){const ph1=b.phase===1;bossFan(a+(b.volleys%2?0.08:-0.08),ph1?7:9,ph1?0.9:1.15,ph1?220:260);b.volleys--;b.fireT=0.38;if(b.volleys<=0){b.st='idle';b.t=ph1?1.2:0.85;}}break;
    case 'slam':hover(0.8);if(b.t<=0){b.st='idle';b.t=b.phase===1?1.0:0.75;}break;
    case 'spiralTele':if(b.t<=0){b.st='spiral';b.t=2.8;b.fireT=0;}break;
    case 'spiral':b.spA+=dt*2.2;b.fireT-=dt;if(b.fireT<=0){for(let k=0;k<3;k++){const ang=b.spA+k*TAU/3;fireBullet(b.x+Math.cos(ang)*50,b.y+Math.sin(ang)*50,ang,170,'orb',10,7);}b.fireT=0.1;}if(b.t<=0){b.st='idle';b.t=0.9;}break;
    case 'chargeTele':if(b.t>0.25)b.lock=angTo(b.x,b.y,P.x,P.y);if(b.t<=0){b.st='charge';b.t=1.35;b.vx=Math.cos(b.lock)*640;b.vy=Math.sin(b.lock)*640;SFX.dash();}break;
    case 'charge':{b.x+=b.vx*dt;b.y+=b.vy*dt;const hitWall=b.x<=A.x0+b.r||b.x>=A.x1-b.r||b.y<=A.y0+b.r*0.4||b.y>=A.y1-b.r*0.6;
      if(hitWall||b.t<=0){b.st='idle';b.t=1.9;if(hitWall){b.dizzy=2.0;SFX.slam();shake=14;spark(b.x,b.y,28,'#e9c27a',340,5,0.55);floater(b.x,b.y-90,'DIZZY! x1.5','#ffe14d',17);}}break;}
    case 'summon':hover(0.8);if(b.t<=0){b.st='idle';b.t=0.9;}break;
    case 'enrage':shake=Math.max(shake,3);if(b.t<=0){b.phase=2;b.st='idle';b.t=0.7;ring(b.x,b.y,30,280,0.5,'#ff4d4d',8);shake=14;}break;
    case 'dying':shake=Math.max(shake,4);if(Math.random()<dt*12){spark(b.x+rand(-60,60),b.y+rand(-50,50),12,Math.random()<0.5?'#ff9f43':'#b06ae0',240,4,0.45);}
      if(b.t<=0){spark(b.x,b.y,70,'#b06ae0',480,6,0.9);bubbles(b.x,b.y,30,140);SFX.boom();const wasFinal=locIdx>=LOCS.length-1;boss=null;onBossDefeated();if(!wasFinal){/* town via onBossDefeated */}return;}break;
  }
  if(b.st!=='intro'){b.x=clamp(b.x,A.x0+b.r,A.x1-b.r);b.y=clamp(b.y,A.y0+b.r*0.4,A.y1-b.r*0.6);}
  if(b.st!=='intro'&&b.st!=='dying'){for(const p of alivePlayers()){if(dist(b.x,b.y,p.x,p.y)<p.r+b.r*0.8){if(p.shieldT>0){const pa=angTo(b.x,b.y,p.x,p.y);p.kx=Math.cos(pa)*450;p.ky=Math.sin(pa)*450;SFX.block();}else hurtPlayer(p,b.st==='charge'?24:14,b.x,b.y,1.4);}}}
}
function updateZones(dt){for(const z of zones){if(!z.done){z.t-=dt;if(z.t<=0){z.done=true;z.after=0.35;SFX.slam();shake=Math.max(shake,5);spark(z.x,z.y,14,'#e9c27a',240,4,0.45);for(const p of alivePlayers()){if(dist(p.x,p.y,z.x,z.y)<z.r+p.r*0.5)hurtPlayer(p,z.dmg,z.x,z.y,1.1);}}}else z.after-=dt;}zones=zones.filter(z=>!z.done||z.after>0);}
function updateMines(dt){
  for(const m of mines){m.t-=dt;m.arm-=dt;if(m.arm>0)continue;let boom=false;
    for(const e of enemies){if(!e.dead&&e.spawnT<=0&&dist(m.x,m.y,e.x,e.y)<e.r+m.r){boom=true;break;}}
    if(boss&&dist(m.x,m.y,boss.x,boss.y)<boss.r+m.r)boom=true;
    if(boom||m.t<=0){m.t=-1;SFX.boom();shake=Math.max(shake,8);ring(m.x,m.y,8,m.br,0.4,'#ffe4ec',6);spark(m.x,m.y,24,'#ff9f43',320,4,0.5);
      for(const e of enemies){if(!e.dead&&dist(m.x,m.y,e.x,e.y)<m.br+e.r)hitEnemy(e,m.dmg,e.x-m.x,e.y-m.y,400);}
      if(boss&&dist(m.x,m.y,boss.x,boss.y)<m.br+boss.r)hitBoss(m.dmg,m.x,m.y);}}
  mines=mines.filter(m=>m.t>0);
}
function updateWhirls(dt){
  for(const w of whirls){w.t-=dt;
    for(const e of enemies){if(e.dead||e.spawnT>0)continue;const d=dist(w.x,w.y,e.x,e.y);if(d<w.r){const a=angTo(e.x,e.y,w.x,w.y);e.kx+=Math.cos(a)*280*dt;e.ky+=Math.sin(a)*280*dt;if(Math.random()<dt*4)hitEnemy(e,w.dmg*dt*3,w.x-e.x,w.y-e.y,20);}}
    if(boss&&dist(w.x,w.y,boss.x,boss.y)<w.r+boss.r){const a=angTo(boss.x,boss.y,w.x,w.y);boss.x+=Math.cos(a)*40*dt;boss.y+=Math.sin(a)*40*dt;if(Math.random()<dt*3)hitBoss(w.dmg*0.5,w.x,w.y);}
    if(Math.random()<0.5)bubbles(w.x+rand(-w.r,w.r)*0.5,w.y+rand(-w.r,w.r)*0.5,1,40);}
  whirls=whirls.filter(w=>w.t>0);
}
function updateBullets(dt){
  for(const b of pBul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)b.life=0;if(b.life<=0)continue;
    for(const e of enemies){if(e.dead||e.spawnT>0)continue;if(dist(b.x,b.y,e.x,e.y)<e.r+b.r){hitEnemy(e,b.dmg,b.vx,b.vy,150);b.life=0;break;}}
    if(b.life>0&&boss&&boss.st!=='dying'&&dist(b.x,b.y,boss.x,boss.y)<boss.r*0.9+b.r){hitBoss(b.dmg,b.x,b.y);b.life=0;}}
  pBul=pBul.filter(b=>b.life>0);
  for(const b of eBul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)b.life=0;if(b.life<=0)continue;
    for(const p of alivePlayers()){const d=dist(b.x,b.y,p.x,p.y);const shR=isUnlocked('shield')?skillStats('shield').r:40;
      if(p.shieldT>0&&d<shR+b.r){const sp=Math.hypot(b.vx,b.vy)*1.55,ra=Math.atan2(-b.vy,-b.vx)+rand(-0.15,0.15);pBul.push({x:b.x,y:b.y,vx:Math.cos(ra)*sp,vy:Math.sin(ra)*sp,r:7,dmg:15,life:1.5,refl:true,owner:p.pid});b.life=0;SFX.block();}
      else if(d<p.r*0.8+b.r){if(hurtPlayer(p,b.dmg,b.x,b.y,0.6))b.life=0;}}}
  eBul=eBul.filter(b=>b.life>0);
}
function updatePickups(dt){for(const p of pickups){p.t-=dt;p.ph+=dt*3;for(const pl of alivePlayers()){if(dist(p.x,p.y,pl.x,pl.y)<pl.r+16){p.t=0;pl.hp=Math.min(pl.maxHp,pl.hp+15);SFX.pickup();floater(pl.x,pl.y-36,'+15 HP','#6dff9c',16);score+=50;}}}pickups=pickups.filter(p=>p.t>0);}
function updateWaveFlow(dt){
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}if(stageIdx>=3)return;
  if(intermission>0){intermission-=dt;if(intermission<=0)advanceAfterIntermission();return;}
  if(spawnQueue.length){waveClock+=dt;while(spawnQueue.length&&spawnQueue[0].t<=waveClock)spawnEnemy(spawnQueue.shift().type);}
  else if(enemies.length===0)onStageClear();
}
function update(dt){
  time+=dt;updateParticles(dt);if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}if(uiToast){uiToast.t-=dt;if(uiToast.t<=0)uiToast=null;}
  shake=Math.max(0,shake-dt*40);
  if(townTimer>0){townTimer-=dt;if(townTimer<=0){townTimer=0;enterTown();}return;}
  if(state==='title'||state==='town'||state==='code'||state==='invite'||state==='map'){if(Math.random()<dt*3)bubbles(rand(0,W),H+5,1,50);return;}
  if(state!=='play'||paused)return;
  if(hitStop>0){hitStop-=dt;return;}
  // guest waits for host state
  if(coop.mode==='online'&&coop.role==='guest'){/* guest still simulates lightly if no snap — prefer snap */
    if(guestSnap&&performance.now()-guestSnap.at<500){/* host-driven; skip local sim heavy */} }
  gameTime+=dt;
  // send guest inputs
  if(coop.mode==='online'&&coop.role==='guest'){
    let mx=0,my=0;if(keys['a']||keys['arrowleft'])mx--;if(keys['d']||keys['arrowright'])mx++;if(keys['w']||keys['arrowup'])my--;if(keys['s']||keys['arrowdown'])my++;
    netSend({t:'input',input:{mx,my,fire:(keys[' ']||mouse.down)?1:0,s0:(keys['q']||keys['1'])?1:0,s1:(keys['e']||keys['2'])?1:0,s2:(keys['r']||keys['3'])?1:0}});
  }
  for(const p of players)updatePlayer(p,dt);
  if(alivePlayers().length===0){deathT-=dt;updateEnemies(dt);updateBullets(dt);if(deathT<=0)endRun(false);return;}
  updateEnemies(dt);updateBoss(dt);if(state!=='play')return;updateZones(dt);updateMines(dt);updateWhirls(dt);updateBullets(dt);updatePickups(dt);updateWaveFlow(dt);
  if(coop.mode==='online'&&coop.role==='host'&&time-coop.lastPing>0.1){coop.lastPing=time;netSend({t:'state',players:players.map(p=>({x:p.x,y:p.y,hp:p.hp,aim:p.aim,dead:p.dead,look:p.look,shieldT:p.shieldT})),score,locIdx,stageIdx});}
}

const FONT='"Trebuchet MS","Segoe UI",Arial,sans-serif';
function text(s,x,y,size,color,align='center',stroke=null,sw=4,weight='800'){ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';if(stroke){ctx.lineJoin='round';ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}ctx.fillStyle=color;ctx.fillText(s,x,y);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);}
function ellipse(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot,0,TAU);}

const decoCache={};
function getDeco(li){
  if(decoCache[li])return decoCache[li];
  let s=11+li*97;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const arr=[];const prop=LOCS[li].theme.prop;
  for(let i=0;i<180;i++)arr.push({k:'speck',x:r()*W,y:A.y0-6+r()*(H-A.y0+6),c:r()});
  for(let i=0;i<12;i++){
    if(prop==='beach')arr.push({k:r()<0.5?'shell':'star',x:50+r()*(W-100),y:A.y0+40+r()*(H-A.y0-80),a:r()*TAU,c:r()});
    else if(prop==='reef')arr.push({k:'coral',x:40+r()*(W-80),y:A.y0+30+r()*(H-A.y0-60),a:r(),c:r(),h:20+r()*40});
    else if(prop==='wreck')arr.push({k:r()<0.4?'plank':'coin',x:40+r()*(W-80),y:A.y0+40+r()*(H-A.y0-70),a:r()*TAU,c:r()});
    else if(prop==='volcano')arr.push({k:r()<0.5?'obsidian':'crack',x:40+r()*(W-80),y:A.y0+40+r()*(H-A.y0-70),a:r(),c:r()});
    else arr.push({k:r()<0.5?'neon':'trash',x:40+r()*(W-80),y:A.y0+40+r()*(H-A.y0-70),a:r(),c:r()});
  }
  // story props
  if(prop==='beach')arr.push({k:'sign',x:120,y:A.y0+90,txt:'BEWARE SEAGULLS'});
  if(prop==='reef')arr.push({k:'mural',x:W-160,y:A.y0+120,txt:'POLYPS REMEMBER'});
  if(prop==='wreck')arr.push({k:'sign',x:200,y:A.y0+80,txt:'HMS SHELLFORTH · 1782'});
  if(prop==='volcano')arr.push({k:'sign',x:W/2,y:A.y0+70,txt:'TEMPER YOUR SHELL'});
  if(prop==='neon')arr.push({k:'neonSign',x:W/2,y:A.y0+50,txt:'CRAB DISCO'});
  decoCache[li]=arr;return arr;
}

function drawBackground(li){
  const th=LOCS[li|0].theme;
  const sg=ctx.createLinearGradient(0,A.y0,0,H);sg.addColorStop(0,th.sand[0]);sg.addColorStop(1,th.sand[1]);ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  const wg=ctx.createLinearGradient(0,0,0,A.y0);wg.addColorStop(0,th.sky);wg.addColorStop(1,th.water[1]);
  ctx.fillStyle=wg;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);
  for(let x=W;x>=0;x-=16)ctx.lineTo(x,A.y0-10+Math.sin(x*0.03+time*2)*4+Math.sin(x*0.011-time)*3);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=th.foam;ctx.globalAlpha=0.85;ctx.lineWidth=4;ctx.beginPath();
  for(let x=0;x<=W;x+=16){const y=A.y0-10+Math.sin(x*0.03+time*2)*4+Math.sin(x*0.011-time)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();ctx.globalAlpha=1;

  if(th.prop==='wreck'){ctx.fillStyle='rgba(201,162,39,.25)';for(let i=0;i<5;i++){const x=(i*190+time*10)%W,y=40+(i*29)%60;circle(x,y,8);ctx.fill();}}
  if(th.prop==='volcano'){for(let i=0;i<6;i++){const x=(i*160+time*40)%W,y=H-30-(time*30+i*50)%120;ctx.fillStyle=`rgba(255,100,40,${0.4})`;circle(x,y,3);ctx.fill();}}
  if(th.prop==='neon'){ctx.strokeStyle=`rgba(0,255,245,${0.3+Math.sin(time*4)*0.2})`;ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.strokeRect(80+i*220,20,40,14);}}
  for(const d of getDeco(li|0)){
    if(d.k==='speck'){ctx.fillStyle=d.c<0.5?'rgba(0,0,0,.2)':'rgba(255,255,255,.25)';ctx.fillRect(d.x,d.y,2,2);}
    else if(d.k==='shell'||d.k==='star'){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.a);ctx.fillStyle=d.k==='shell'?'#fbe3e8':'#ff9f6b';if(d.k==='shell'){ctx.beginPath();ctx.moveTo(0,6);ctx.arc(0,0,9,Math.PI*1.05,Math.PI*1.95);ctx.closePath();ctx.fill();}else{ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?4:10,an=i/10*TAU-Math.PI/2;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}ctx.closePath();ctx.fill();}ctx.restore();}
    else if(d.k==='coral'){ctx.fillStyle=['#ff7eb9','#7fffd4','#ffa07a'][Math.floor(d.c*3)];for(let i=0;i<3;i++){rr(d.x+i*6-6,d.y-d.h*(0.5+i*0.15),5,d.h*(0.5+i*0.15),3);ctx.fill();}}
    else if(d.k==='plank'){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.a);ctx.fillStyle='#6b5b4a';ctx.fillRect(-20,-4,40,8);ctx.restore();}
    else if(d.k==='coin'){ctx.fillStyle='#c9a227';circle(d.x,d.y,6);ctx.fill();ctx.fillStyle='#ffe66d';circle(d.x-1,d.y-1,2);ctx.fill();}
    else if(d.k==='obsidian'){ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.moveTo(d.x,d.y-12);ctx.lineTo(d.x+10,d.y+8);ctx.lineTo(d.x-10,d.y+8);ctx.closePath();ctx.fill();}
    else if(d.k==='crack'){ctx.strokeStyle='#ff6a30';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+15,d.y+8);ctx.lineTo(d.x+8,d.y+20);ctx.stroke();}
    else if(d.k==='neon'){ctx.strokeStyle='#e94560';ctx.shadowColor='#e94560';ctx.shadowBlur=8;ctx.strokeRect(d.x,d.y,24,10);ctx.shadowBlur=0;}
    else if(d.k==='trash'){ctx.fillStyle='#6a7280';rr(d.x,d.y,14,10,2);ctx.fill();}
    else if(d.k==='sign'||d.k==='mural'){ctx.fillStyle='rgba(40,30,20,.75)';rr(d.x-70,d.y-14,140,28,4);ctx.fill();text(d.txt,d.x,d.y,11,'#f5e6c8','center',null,0,'700');}
    else if(d.k==='neonSign'){ctx.save();ctx.shadowColor='#00fff5';ctx.shadowBlur=12;text(d.txt,d.x,d.y,22,'#00fff5','center',null,0,'900');ctx.shadowBlur=0;ctx.restore();}
  }
  // location story ribbon
  text(LOCS[li|0].story,W/2,A.y0+18,11,'rgba(255,255,255,.55)','center',null,0,'600');
}

function colorSet(look){return COLORS[look.color]||COLORS.scarlet;}
function drawClaw(cx,cy,ang,open,look){
  const cs=colorSet(look);ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.fillStyle=cs.claw;ctx.strokeStyle=cs.stroke;ctx.lineWidth=2;
  const style=look.claws||'classic';
  if(style==='spiked'){ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(18,-10);ctx.lineTo(22,-2);ctx.lineTo(18,2);ctx.lineTo(8,6);ctx.closePath();ctx.fill();ctx.stroke();
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(8+i*4,-6+i);ctx.lineTo(10+i*4,-14+i);ctx.lineTo(12+i*4,-5+i);ctx.fill();}}
  else if(style==='jeweled'){ctx.save();ctx.rotate(-open);ctx.beginPath();ctx.moveTo(2,-3);ctx.quadraticCurveTo(13,-13,22,-3);ctx.quadraticCurveTo(12,-3,3,3);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    ctx.save();ctx.rotate(open);ctx.beginPath();ctx.moveTo(2,3);ctx.quadraticCurveTo(13,12,20,3);ctx.quadraticCurveTo(12,3,3,-3);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    ctx.fillStyle='#7fe3ff';circle(8,0,3);ctx.fill();}
  else if(style==='heavy'){ellipse(8,0,14,10);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(18,-6);ctx.lineTo(28,0);ctx.lineTo(18,6);ctx.closePath();ctx.fill();}
  else{ctx.save();ctx.rotate(-open);ctx.beginPath();ctx.moveTo(2,-3);ctx.quadraticCurveTo(13,-13,22,-3);ctx.quadraticCurveTo(12,-3,3,3);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    ctx.save();ctx.rotate(open);ctx.beginPath();ctx.moveTo(2,3);ctx.quadraticCurveTo(13,12,20,3);ctx.quadraticCurveTo(12,3,3,-3);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
  const g=ctx.createRadialGradient(-2,-3,1,0,0,11);g.addColorStop(0,cs.body[0]);g.addColorStop(1,cs.body[1]);ctx.fillStyle=g;ellipse(0,0,11,9);ctx.fill();ctx.stroke();ctx.restore();
}
function drawCrab(x,y,o){
  const look=o.look||meta.look,cs=colorSet(look),s=o.scale||1;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.18)';ellipse(0,22,32,8);ctx.fill();
  const bob=Math.sin(o.walk*2)*1.5;ctx.translate(0,bob);
  const fl=Math.sin(o.t*7+o.walk)*4;ctx.fillStyle='#2a5bd7';ctx.strokeStyle='#163a8f';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-15,-10);ctx.quadraticCurveTo(-30,8+fl,-22,26);ctx.lineTo(-7,21+fl*0.5);ctx.lineTo(0,27);ctx.lineTo(7,21-fl*0.5);ctx.lineTo(22,26);ctx.quadraticCurveTo(30,8-fl,15,-10);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle=cs.stroke;ctx.lineWidth=4;ctx.lineCap='round';
  for(const side of[-1,1])for(let i=0;i<3;i++){const ph=o.walk*1.6+i*1.3+(side>0?Math.PI:0),lift=Math.sin(ph)*3;ctx.beginPath();ctx.moveTo(side*15,1+i*5);ctx.lineTo(side*(29+i*2),1+i*5-5+lift);ctx.lineTo(side*(35+i),1+i*5+10+lift);ctx.stroke();}
  const aim=o.aim,open=0.28+(o.snap>0?0.35:0)+Math.sin(o.t*3)*0.05;const cl=[];
  for(const side of[-1,1]){const cx=side*30+Math.cos(aim)*7,cy=-16+Math.sin(aim)*7;ctx.strokeStyle=cs.claw;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(side*16,-4);ctx.quadraticCurveTo(side*26,-2,cx,cy);ctx.stroke();cl.push([cx,cy]);}
  const g=ctx.createRadialGradient(-6,-8,3,0,0,28);g.addColorStop(0,cs.body[0]);g.addColorStop(1,cs.body[1]);ctx.fillStyle=g;ctx.strokeStyle=cs.stroke;ctx.lineWidth=2.5;ellipse(0,0,25,17);ctx.fill();ctx.stroke();
  // patterns
  ctx.save();ctx.beginPath();ellipse(0,0,25,17);ctx.clip();
  if(look.pattern==='stripes'){ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=3;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*10,-20);ctx.lineTo(i*10+8,20);ctx.stroke();}}
  else if(look.pattern==='spots'){ctx.fillStyle='rgba(0,0,0,.22)';for(const [px,py]of[[-10,-4],[8,2],[-4,6],[12,-6],[-14,4]]){circle(px,py,3.5);ctx.fill();}}
  else if(look.pattern==='crystals'){ctx.fillStyle='rgba(180,240,255,.45)';for(const [px,py]of[[-8,-6],[6,-2],[0,6]]){ctx.beginPath();ctx.moveTo(px,py-5);ctx.lineTo(px+4,py);ctx.lineTo(px,py+5);ctx.lineTo(px-4,py);ctx.closePath();ctx.fill();}}
  else if(look.pattern==='waves'){ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,i*6-6,16,0.2*Math.PI,0.8*Math.PI);ctx.stroke();}}
  else if(look.pattern==='hex'){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;for(const [px,py]of[[0,0],[-12,0],[12,0],[0,-10]]){ctx.beginPath();for(let i=0;i<6;i++){const an=i/6*TAU;ctx.lineTo(px+Math.cos(an)*5,py+Math.sin(an)*5);}ctx.closePath();ctx.stroke();}}
  ctx.restore();
  ctx.fillStyle='#ffd23f';ctx.strokeStyle='#a5720a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo(9,1);ctx.lineTo(0,12);ctx.lineTo(-9,1);ctx.closePath();ctx.fill();ctx.stroke();text('S',0,3.5,10,'#c0392b','center',null,0,'900');
  for(const[cx,cy]of cl)drawClaw(cx,cy,aim,open,look);
  ctx.strokeStyle=cs.claw;ctx.lineWidth=3.5;for(const side of[-1,1]){ctx.beginPath();ctx.moveTo(side*7,-13);ctx.lineTo(side*9,-25);ctx.stroke();}
  // eyes
  const eye=look.eyes||'hero';

  ctx.restore();
}

function eyes(x,y,sep,r,look){for(const s of[-1,1]){ctx.fillStyle='#fff';circle(x+s*sep,y,r);ctx.fill();ctx.fillStyle='#111';circle(x+s*sep+Math.cos(look)*r*0.35,y+Math.sin(look)*r*0.35,r*0.55);ctx.fill();}}

    ctx.fillStyle='#ffa41b';ctx.beginPath();ctx.moveTo(e.r*0.6,-3);ctx.lineTo(e.r+8,0);ctx.lineTo(e.r*0.6,3);ctx.closePath();ctx.fill();
    eyes(4,-2,4,3,0);ctx.restore();

    ctx.strokeStyle=e.color;ctx.lineWidth=3;for(let i=0;i<5;i++){const bx=-10+i*5;ctx.beginPath();ctx.moveTo(bx,2);for(let k=1;k<=4;k++)ctx.lineTo(bx+Math.sin(e.anim*5+i+k)*3,2+k*5);ctx.stroke();}
    const g=ctx.createRadialGradient(-3,-6,2,0,-2,e.r);g.addColorStop(0,'#fff');g.addColorStop(1,e.color);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,2,e.r,Math.PI,0);ctx.quadraticCurveTo(e.r*0.5,6,0,3);ctx.quadraticCurveTo(-e.r*0.5,6,-e.r,2);ctx.fill();eyes(0,-4,4,3,look);ctx.restore();

function drawBoss(){
  const b=boss;if(!b)return;
  if(b.st==='chargeTele'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.lock);const p=1-b.t/0.95;ctx.fillStyle=`rgba(255,40,60,${0.12+p*0.2})`;ctx.fillRect(0,-b.r*0.85,1000,b.r*1.7);ctx.strokeStyle='rgba(255,40,60,.85)';ctx.lineWidth=2;ctx.strokeRect(0,-b.r*0.85,1000,b.r*1.7);ctx.restore();}
  const enr=b.phase===2||b.st==='enrage';
  let c1='#a65fd6',c2='#4a1c78';
  if(b.id==='hydra'){c1=enr?'#ff7eb9':'#2ee6c8';c2=enr?'#a01858':'#0d6b60';}
  else if(b.id==='captain'){c1=enr?'#c9a227':'#8a9bb0';c2=enr?'#5a3a08':'#2a3548';}
  else if(b.id==='titan'){c1=enr?'#ff6a30':'#6a4038';c2=enr?'#8a1a08':'#2a1815';}
  else if(b.id==='mech'){c1=enr?'#e94560':'#00fff5';c2=enr?'#7a1028':'#0a4a55';}
  else if(enr){c1='#e0565b';c2='#7a1426';}
  ctx.save();ctx.translate(b.x,b.y);if(b.st==='enrage')ctx.translate(rand(-2,2),rand(-2,2));
  ctx.fillStyle='rgba(0,0,0,.2)';ellipse(0,b.r+20,b.r*1.2,14);ctx.fill();
  // tentacles / limbs
  for(let i=0;i<8;i++){const base=Math.PI*(0.1+0.8*i/7),sx=Math.cos(base)*b.r*0.75,sy=Math.sin(base)*b.r*0.45+8;let px=sx,py=sy;
    for(let k=1;k<=8;k++){const wv=Math.sin(time*3+i*0.9+k*0.5)*(5+k);const nx=sx+Math.cos(base)*k*8+Math.cos(base+Math.PI/2)*wv,ny=sy+Math.sin(base)*k*8+k*2.5;
      ctx.strokeStyle=c2;ctx.lineWidth=16-k*1.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(nx,ny);ctx.stroke();
      ctx.strokeStyle=c1;ctx.lineWidth=Math.max(1,11-k);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(nx,ny);ctx.stroke();px=nx;py=ny;}}
  const g=ctx.createRadialGradient(-15,-30,6,0,-8,b.r+15);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.strokeStyle='#1a0a28';ctx.lineWidth=3;ellipse(0,-8,b.r,b.r*0.92);ctx.fill();ctx.stroke();
  // crown / helm by boss
  if(b.id==='kraken'||b.id==='captain'){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(-30,-58);ctx.lineTo(-34,-86);ctx.lineTo(-16,-70);ctx.lineTo(0,-94);ctx.lineTo(16,-70);ctx.lineTo(34,-86);ctx.lineTo(30,-58);ctx.closePath();ctx.fill();}
  if(b.id==='mech'){ctx.fillStyle='#222';rr(-28,-70,56,18,4);ctx.fill();ctx.fillStyle='#00fff5';ctx.fillRect(-20,-64,16,6);ctx.fillRect(4,-64,16,6);}
  if(b.id==='titan'){ctx.fillStyle='#ff6a30';for(let i=0;i<5;i++){const an=-Math.PI/2+(i-2)*0.35;ctx.beginPath();ctx.moveTo(Math.cos(an)*30,Math.sin(an)*30-20);ctx.lineTo(Math.cos(an)*50,Math.sin(an)*50-40);ctx.lineTo(Math.cos(an+0.1)*30,Math.sin(an+0.1)*30-20);ctx.fill();}}
  if(b.id==='hydra'){for(let h=0;h<3;h++){const ang=-0.8+h*0.8;ctx.fillStyle=c1;ellipse(Math.cos(ang)*40,Math.sin(ang)*30-40,16,20);ctx.fill();ctx.fillStyle='#fff';circle(Math.cos(ang)*44,Math.sin(ang)*30-46,5);ctx.fill();}}
  const look=angTo(b.x,b.y,primary()?primary().x:W/2,primary()?primary().y:H/2);const glow=b.st.includes('Tele');
  for(const s of[-1,1]){ctx.fillStyle='#fff';ellipse(s*24,-16,15,18);ctx.fill();ctx.fillStyle=glow?'#fff36b':enr?'#ff3b3b':'#ffd23f';if(glow){ctx.shadowColor='#fff36b';ctx.shadowBlur=14;}circle(s*24+Math.cos(look)*5,-14+Math.sin(look)*6,9);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#111';ellipse(s*24+Math.cos(look)*6,-14+Math.sin(look)*7,3,6);ctx.fill();}
  if(b.dizzy>0)for(let i=0;i<3;i++){const an=time*5+i*TAU/3;text('★',Math.cos(an)*42,-96+Math.sin(an)*8,16,'#ffe14d','center','#7a5a00',3);}
  ctx.restore();
  if(b.flash>0){ctx.fillStyle='rgba(255,255,255,.5)';ellipse(b.x,b.y-8,b.r,b.r*0.92);ctx.fill();}

  if(b.id==='captain'&&(b.barrier|0)>0){const pr=b.barrier/b.barrierMax;ctx.strokeStyle=`rgba(138,155,176,${0.45+pr*0.4})`;ctx.lineWidth=4;circle(b.x,b.y-8,b.r+18);ctx.stroke();ctx.strokeStyle='rgba(201,162,39,.85)';ctx.lineWidth=2;circle(b.x,b.y-8,b.r+18);ctx.stroke();text('BARRIER '+Math.ceil(b.barrier),b.x,b.y+b.r+18,11,'#c9a227','center','rgba(0,0,0,.6)',3);}
  // Hydra head pips
  if(b.id==='hydra'&&b.headHp){b.headHp.forEach((h,i)=>{const hx=b.x-40+i*40,hy=b.y-b.r-28;ctx.fillStyle='rgba(0,0,0,.5)';rr(hx-18,hy,36,6,3);ctx.fill();ctx.fillStyle=h>0?'#2ee6c8':'#552233';if(h>0){rr(hx-18,hy,36*(h/b.headMax),6,3);ctx.fill();}text(h>0?'':'×',hx,hy+3,10,'#ff7eb9','center');});if(b.headWindow>0)text('BODY EXPOSED',b.x,b.y+b.r+16,12,'#ffe14d','center','rgba(0,0,0,.6)',3);}
  // Mech hack aura
  if(b.id==='mech'&&b.st==='hack'){ctx.strokeStyle=`rgba(109,255,156,${0.5+Math.sin(time*10)*0.3})`;ctx.lineWidth=4;circle(b.x,b.y-8,b.r+22);ctx.stroke();text('HACK',b.x,b.y+b.r+16,13,'#6dff9c','center','rgba(0,0,0,.6)',3);}
}
function drawZones(){for(const z of zones){if(!z.done){const p=1-z.t/z.max;ctx.fillStyle=`rgba(255,40,60,${0.12+p*0.22})`;circle(z.x,z.y,z.r);ctx.fill();ctx.strokeStyle='rgba(255,40,60,.85)';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;circle(z.x,z.y,z.r*p);ctx.stroke();}else{const k=Math.sin((z.after/0.35)*Math.PI);ctx.save();ctx.translate(z.x,z.y);ctx.fillStyle=LOCS[locIdx].theme.accent;ctx.beginPath();ctx.moveTo(-14,5);ctx.quadraticCurveTo(-16,-45*k,3,-62*k);ctx.quadraticCurveTo(9,-35*k,14,5);ctx.closePath();ctx.fill();ctx.restore();}}}
function drawBullets(){for(const b of pBul){const g=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,b.r+2);if(b.refl){g.addColorStop(0,'#fff');g.addColorStop(1,'#ffc93c');}else{g.addColorStop(0,'#fff');g.addColorStop(1,'#4fc8ff');}ctx.fillStyle=g;circle(b.x,b.y,b.r);ctx.fill();}
  for(const b of eBul){if(b.kind==='spine'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.fillStyle='#5b2a86';ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-6,-4);ctx.lineTo(-8,0);ctx.lineTo(-6,4);ctx.closePath();ctx.fill();ctx.restore();}
    else if(b.kind==='ink'){ctx.fillStyle='#2a0f3d';circle(b.x,b.y,b.r);ctx.fill();ctx.strokeStyle='#c77dff';ctx.lineWidth=2;ctx.stroke();}

function drawPickups(){for(const p of pickups){if(p.t<3&&Math.floor(time*8)%2)continue;const y=p.y+Math.sin(p.ph)*3;ctx.fillStyle='rgba(109,255,156,.25)';circle(p.x,y,14);ctx.fill();ctx.fillStyle='#ffe4ec';circle(p.x,y,9);ctx.fill();ctx.fillStyle='#2ecc71';ctx.fillRect(p.x-1.5,y-6,3,8);ctx.fillRect(p.x-4,y-3,8,3);}}
function drawMines(){for(const m of mines){ctx.fillStyle=m.arm>0?'#aaa':'#ffe4ec';circle(m.x,m.y,m.r);ctx.fill();ctx.strokeStyle='#d0587e';ctx.lineWidth=2;ctx.stroke();if(m.arm<=0){ctx.strokeStyle=`rgba(255,100,150,${0.3+Math.sin(time*8)*0.2})`;circle(m.x,m.y,m.br*0.35);ctx.stroke();}}}
function drawWhirls(){for(const w of whirls){const a=w.t/w.max;ctx.strokeStyle=`rgba(79,200,255,${0.35+a*0.4})`;ctx.lineWidth=3;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(w.x,w.y,w.r*(0.4+i*0.2),time*3+i,time*3+i+2);ctx.stroke();}}}
function drawParticles(){for(const p of parts){const a=Math.max(0,p.life/p.max);if(p.t==='spark'){ctx.globalAlpha=a;ctx.fillStyle=p.color;circle(p.x,p.y,p.size*(0.5+a*0.5));ctx.fill();}else if(p.t==='bubble'){ctx.globalAlpha=Math.min(1,a*1.5)*0.75;ctx.strokeStyle='#e8fbff';ctx.lineWidth=1.5;circle(p.x,p.y,p.size);ctx.stroke();}else if(p.t==='ring'){ctx.globalAlpha=a;ctx.strokeStyle=p.color;ctx.lineWidth=p.w*a+0.5;circle(p.x,p.y,p.r0+(p.r1-p.r0)*(1-a));ctx.stroke();}else if(p.t==='text'){ctx.globalAlpha=Math.min(1,a*2);text(p.text,p.x,p.y,p.size,p.color,'center','rgba(0,0,0,.7)',3);}}ctx.globalAlpha=1;}
function drawPlayers(){for(const p of players){for(const t of p.trail){ctx.globalAlpha=t.life/0.2*0.3;drawCrab(t.x,t.y,{aim:p.aim,walk:p.walk,t:time,snap:0,look:p.look});}ctx.globalAlpha=1;if(p.dead)continue;const blink=p.inv>0&&Math.floor(time*20)%2===0;if(!blink)drawCrab(p.x,p.y,{aim:p.aim,walk:p.walk,t:time,snap:p.snap,look:p.look});

  if(players.length>1)text(p.pid===0?'P1':'P2',p.x,p.y-36,12,'#fff','center','rgba(0,0,0,.6)',3);}}

function render(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0&&state==='play'&&!paused)ctx.translate(rand(-shake,shake)*0.55,rand(-shake,shake)*0.55);
  if(state==='title'){drawTitle();ctx.restore();drawParticles();return;}
  if(state==='code'){drawCodeScreen();ctx.restore();return;}
  if(state==='invite'){drawInvite();ctx.restore();return;}
  if(state==='town'){drawTown();ctx.restore();drawBanner();if(uiToast)text(uiToast.msg,W/2,H-28,16,'#ffe66d','center','rgba(0,0,0,.7)',4);return;}
  drawBackground(locIdx);drawZones();drawPickups();drawMines();drawWhirls();
  for(const e of enemies)if(e.ai!=='dive')drawEnemy(e);drawBoss();drawPlayers();
  for(const e of enemies)if(e.ai==='dive')drawEnemy(e);drawBullets();drawParticles();ctx.restore();
  if(state==='play'){
    drawHUD();if(isTouch&&!paused)drawTouch();drawBanner();
    if(paused){ctx.fillStyle='rgba(0,20,40,.65)';ctx.fillRect(0,0,W,H);text('PAUSED',W/2,H/2-10,52,'#fff','center','#0b2238',8,'900');text('P / Esc / click to resume',W/2,H/2+36,16,'#dfefff','center',null,0,'700');drawIconBtn(BTN.mute,'mute');drawIconBtn(BTN.pause,'pause');}
  }else if(state==='win'||state==='over')drawEnd(state==='win');
}

// ===== INPUT =====
function onKeyMenu(k){
  if(k==='m'){toggleMute();return true;}
  if(state==='title'){if(k==='enter'||k===' '){if(hasSave())continueCampaign();else newCampaign();return true;}}
  if(state==='code'){if(k==='enter'){if(importSaveCode(codeInput)){toast('Imported');state='title';}else toast('Invalid');return true;}if(k==='escape'){state='title';return true;}}
  if(state==='invite'&&(k==='escape')){state='title';return true;}
  if(state==='town'&&(k==='enter')){if(townTab==='rest')leaveTownToNext();return true;}
  if((state==='win'||state==='over')&&(k==='enter'||k===' ')&&time-endT>0.7){if(state==='win'&&meta.inTown&&!meta.campaignWon)enterTown();else state='title';return true;}
  return false;
}
function onPress(k){
  if(onKeyMenu(k))return;
  if(state==='play'){if(k==='p'||k==='escape'){paused=!paused;return;}}
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  ensureAudio();if(isTouch&&k.length===1)isTouch=false;
  if(state==='code'&&k.length===1&&!e.metaKey&&!e.ctrlKey){codeInput+=e.key;return;}
  if(state==='code'&&k==='backspace'){codeInput=codeInput.slice(0,-1);return;}
  if(!e.repeat)onPress(k);keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;if(state==='play')paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true;});
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
const inCircle=(p,c,slop=12)=>dist(p.x,p.y,c.x,c.y)<=c.r+slop;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();ensureAudio();const p=toLogical(e),touch=e.pointerType==='touch'||e.pointerType==='pen';
  if(touch)isTouch=true;else{mouse.x=p.x;mouse.y=p.y;mouse.t=time;}
  if(inRect(p,BTN.mute)){toggleMute();return;}
  const b=hitBtn(p);if(b){b.fn();return;}
  if(state==='title'){/* buttons handle */}
  if(state==='play'){
    if(inRect(p,BTN.pause)){paused=!paused;return;}
    if(paused){paused=false;return;}
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    if(touch){
      if(inCircle(p,TB.fire)){fireTouchId=e.pointerId;return;}
      if(inCircle(p,TB.s0)){useSkillSlot(primary(),0);return;}
      if(inCircle(p,TB.s1)){useSkillSlot(primary(),1);return;}
      if(inCircle(p,TB.s2)){useSkillSlot(primary(),2);return;}
      if(p.x<W*0.55&&joy.id===null){joy.id=e.pointerId;joy.bx=p.x;joy.by=p.y;joy.dx=joy.dy=0;return;}
      if(p.x>=W*0.55)fireTouchId=e.pointerId;
    }else if(e.button===0)mouse.down=true;
    else if(e.button===2)useSkillSlot(primary(),0);
  }
  if((state==='win'||state==='over')&&time-endT>0.7){/* buttons */}
});
cv.addEventListener('pointermove',e=>{
  const p=toLogical(e);if(e.pointerType==='mouse'){mouse.x=p.x;mouse.y=p.y;mouse.t=time;}
  if(e.pointerId===joy.id){let dx=p.x-joy.bx,dy=p.y-joy.by;const l=Math.hypot(dx,dy),max=50;if(l>max){joy.bx+=dx/l*(l-max);joy.by+=dy/l*(l-max);dx=dx/l*max;dy=dy/l*max;}joy.dx=dx/max;joy.dy=dy/max;if(Math.hypot(joy.dx,joy.dy)<0.15)joy.dx=joy.dy=0;}
});
function releasePointer(e){if(e.pointerId===joy.id){joy.id=null;joy.dx=joy.dy=0;}if(e.pointerId===fireTouchId)fireTouchId=null;if(e.pointerType==='mouse')mouse.down=false;}
cv.addEventListener('pointerup',releasePointer);cv.addEventListener('pointercancel',releasePointer);
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')mouse.down=false;});
// paste into code screen
addEventListener('paste',e=>{if(state==='code'){const t=(e.clipboardData||window.clipboardData).getData('text');if(t)codeInput+=t.trim();}});

// ===== LOOP =====
let last=performance.now();
function frame(now){const dt=Math.min(0.033,Math.max(0,(now-last)/1000));last=now;update(dt);render();requestAnimationFrame(frame);}
// boot
loadSave();
const invite=parseInviteHash();
if(invite){state='invite';joinRoom(invite);toast('Invite room '+invite);}
requestAnimationFrame(frame);

// ===== TEST HOOKS =====
window.__superCrab={
  get state(){return state;},get meta(){return meta;},get loc(){return locIdx;},get stage(){return stageIdx;},
  get boss(){return boss;},get players(){return players;},get enemies(){return enemies;},get score(){return score;},
  get coop(){return coop;},get spawnQueue(){return spawnQueue;},get mines(){return mines;},get whirls(){return whirls;},
  get muted(){return muted;},get isTouch(){return isTouch;},setTouch(v){isTouch=!!v;},
  LOCS,SKILL_DEF,COLORS,EDEF,
  startGame:()=>newCampaign(),newCampaign,continueCampaign,enterTown,beginStage,leaveTownToNext,
  exportSaveCode,importSaveCode,autosave,loadSave,wipeSave,toggleMute,
  press:onPress,keys,update,render,useSkillSlot,hitBoss,hitEnemy,killEnemy,primary,spawnEnemy,spawnBoss,
  openHostRoom,startLocalCoop,joinRoom,jumpTo(li,si){beginStage(li,si);},setPoints(n){meta.points=n;autosave();},
  forceClearStage(){spawnQueue.length=0;enemies.forEach(e=>killEnemy(e,true));enemies=[];onStageClear();},
  unlockAll(){for(const id of SKILL_KEYS)meta.skills[id]=Math.max(1,meta.skills[id]||1);PATTERNS.forEach(x=>{if(!meta.unlocked.patterns.includes(x))meta.unlocked.patterns.push(x);});Object.keys(COLORS).forEach(x=>{if(!meta.unlocked.colors.includes(x))meta.unlocked.colors.push(x);});CLAWS.forEach(x=>{if(!meta.unlocked.claws.includes(x))meta.unlocked.claws.push(x);});EYES.forEach(x=>{if(!meta.unlocked.eyes.includes(x))meta.unlocked.eyes.push(x);});ACCESSORIES.forEach(x=>{if(!meta.unlocked.accessories.includes(x))meta.unlocked.accessories.push(x);});autosave();}
};
})();
</script>
